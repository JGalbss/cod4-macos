# Pinned upstream inputs for mac/tools/fetch-build-sdl2-compat.zsh.
SDL2COMPAT_VERSION=2.32.70
SDL2COMPAT_ARCHIVE=sdl2-compat-2.32.70.tar.gz
SDL2COMPAT_URL=https://github.com/libsdl-org/sdl2-compat/releases/download/release-2.32.70/sdl2-compat-2.32.70.tar.gz
SDL2COMPAT_SHA256=998fa62557eb46ffe7e5c3e2c123bc332f7df9d9f593b3ceed88ed1158428a44

# sdl2-compat compiles against and dynamically loads SDL3. Build both from the
# same pinned official SDL3 release instead of using Homebrew artifacts.
SDL3_HEADERS_VERSION=3.4.14
SDL3_HEADERS_ARCHIVE=SDL3-3.4.14.tar.gz
SDL3_HEADERS_URL=https://github.com/libsdl-org/SDL/releases/download/release-3.4.14/SDL3-3.4.14.tar.gz
SDL3_HEADERS_SHA256=30d4aa2b3037718142b32dffd4e72f917ebb6cc5227150e7bb9c45efb2153aeb

SDL2COMPAT_DEPLOYMENT_TARGET=15.5
SDL2COMPAT_SOURCE_DATE_EPOCH=0
SDL2COMPAT_DYLIB=libSDL2-2.0.0.dylib
SDL2COMPAT_INSTALL_NAME=@rpath/libSDL2-2.0.0.dylib
SDL3_BUILD_DYLIB=libSDL3.0.dylib
SDL3_RUNTIME_DYLIB=libSDL3.dylib
SDL3_INSTALL_NAME=@rpath/libSDL3.0.dylib
