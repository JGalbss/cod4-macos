name: Native macOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-build:
    name: Source audit and arm64 build
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify native runner
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version

      - name: Install build tools
        run: brew install cmake ninja premake sdl2-compat glm ripgrep

      - name: Audit the public source tree
        shell: zsh {0}
        run: |
          set -euo pipefail
          audit_dir="${RUNNER_TEMP}/public-source"
          mac/tools/export-public-source.zsh "${audit_dir}"
          cmp PUBLIC_SOURCE_MANIFEST.sha256 \
            "${audit_dir}/PUBLIC_SOURCE_MANIFEST.sha256"
          (
            cd "${audit_dir}"
            shasum -a 256 -c PUBLIC_SOURCE_MANIFEST.sha256 >/dev/null
          )

      - name: Build pinned OpenAssetTools
        shell: zsh {0}
        run: |
          set -euo pipefail
          oat_root="${RUNNER_TEMP}/OpenAssetTools"
          git clone --recurse-submodules \
            https://github.com/JGalbss/OpenAssetTools.git "${oat_root}"
          git -C "${oat_root}" checkout --detach \
            0ad64096aa6ee2874f835fff8a5c6dc4af8c7f77
          git -C "${oat_root}" submodule update --init --recursive
          "${oat_root}/mac-build.sh"

      - name: Configure native Metal client
        shell: zsh {0}
        run: |
          set -euo pipefail
          mac/tools/check-native-regressions.zsh
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.5 \
            -DKISAK_TARGET=posix \
            -DKISAK_METAL=ON \
            -DOAT_ROOT="${RUNNER_TEMP}/OpenAssetTools"

      - name: Build native client
        run: cmake --build build-ci --target kisak_posix --parallel 3

      - name: Verify source-built outputs
        shell: zsh {0}
        run: |
          set -euo pipefail
          client='bin/posix/jgalbs cod4'
          test -x "${client}"
          file "${client}" | grep -F 'Mach-O 64-bit executable arm64'
          xcrun --sdk macosx clang++ -std=c++17 -Wall -Wextra -Werror \
            -O2 mac/tools/iwi-cube-dump.cpp \
            -o "${RUNNER_TEMP}/iwi-cube-dump"
          file "${RUNNER_TEMP}/iwi-cube-dump" | \
            grep -F 'Mach-O 64-bit executable arm64'

      # This source CI intentionally uploads no application or disk image.
      # Public binaries require Developer ID signing, notarization, final-DMG
      # validation, and matching GPL corresponding source.
