name: Native client improvement
description: Propose a focused improvement for the Apple Silicon port
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Proposals must remain source-only and must not require redistributing
        Call of Duty 4 data or an unlicensed proprietary dependency.

  - type: dropdown
    id: subsystem
    attributes:
      label: Subsystem
      options:
        - Metal renderer and shaders
        - Input and windowing
        - Audio and voice
        - Networking and multiplayer
        - Gameplay and UI
        - Asset and data compatibility
        - Performance and stability
        - Packaging and updates
        - Build and dependencies
        - Tests, documentation, or CI
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: Describe the user-visible limitation and why it matters.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Include likely files or interfaces if known.
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Acceptance and validation
      description: Define observable success, performance measurements, or regression tests.
    validations:
      required: true

  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: The proposal does not require retail data in the repository or release bundle.
          required: true
        - label: The proposal does not depend on publishing an unsigned binary.
          required: true
